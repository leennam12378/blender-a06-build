
name: Build Blender Android Full

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-14 g++-14 \
            cmake ninja-build patchelf zip unzip \
            git-lfs openjdk-17-jdk python3 curl

      - name: Configure Android SDK
        run: |
          mkdir -p "$HOME/android-sdk"
          ln -sfn "$ANDROID_HOME/cmdline-tools" "$HOME/android-sdk/cmdline-tools"
          ln -sfn "$ANDROID_HOME/platform-tools" "$HOME/android-sdk/platform-tools"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "ndk;30.0.14904198-beta1" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

      - name: Download Blender source
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git clone --depth 1 \
            --branch android-alpha-4 \
            https://github.com/simfeo/blender.git blender

          cd blender
          git lfs install --local
          git config lfs.url \
            https://projects.blender.org/blender/blender.git/info/lfs
          git config --local \
            credential.https://projects.blender.org.helper \
            '!f() { echo username=; echo password=; }; f'

          git lfs pull

          git -c submodule.lib/linux_x64.update=checkout \
            submodule update --init lib/linux_x64
          git submodule update --init lib/android_arm64

      - name: Prepare Vulkan headers
        run: |
          curl -fL \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.341.tar.gz \
            -o /tmp/vulkan-headers.tar.gz

          mkdir -p /tmp/vulkan-headers
          tar -xzf /tmp/vulkan-headers.tar.gz \
            -C /tmp/vulkan-headers --strip-components=1

          mkdir -p blender_build_android/lib/vulkan_headers
          cp -R /tmp/vulkan-headers/include \
            blender_build_android/lib/vulkan_headers/

      - name: Check available resources
        run: |
          df -h
          free -h

      - name: Build Full APK with Cycles
        working-directory: blender
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOST_CC=gcc-14
          export ANDROID_HOST_CXX=g++-14
          python3 build_files/android/build.py full

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-full
          path: blender_build_android/android_apk_stage_full/blender-full.apk
          if-no-files-found: error
          retention-days: 7
